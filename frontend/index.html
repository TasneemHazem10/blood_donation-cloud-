<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Blood Donation Drive Organizer - find a drive, check eligibility, book a seat and manage donation days." />
  <title>Blood Donation Drive Organizer</title>
  <link rel="stylesheet" href="css/styles.css" />
  <script src="js/config.js"></script>
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <header class="site-header">
    <div class="shell header-inner">
      <a class="brand" href="#/">
        <span class="brand-mark" aria-hidden="true">+</span>
        <span>Blood<span class="brand-accent">Link</span></span>
      </a>
      <button class="nav-toggle" id="navToggle" aria-label="Toggle menu" aria-expanded="false">☰</button>
      <nav class="site-nav" id="siteNav" aria-label="Main navigation"></nav>
    </div>
  </header>

  <main id="app" class="shell" tabindex="-1">
    <div class="loading-screen"><span class="spinner"></span><p>Loading the latest data…</p></div>
  </main>

  <footer class="site-footer">
    <div class="shell footer-inner">
      <span>BloodLink · Cloud Computing group project</span>
      <span id="systemStatus">Checking services…</span>
    </div>
  </footer>

  <div id="toastHost" class="toast-host" aria-live="polite" aria-atomic="true"></div>
  <div id="modalHost"></div>
</body>
</html>
