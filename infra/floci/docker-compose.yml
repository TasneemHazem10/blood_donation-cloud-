services:
  floci:
    image: floci/floci:latest
    container_name: bdo-floci
    ports:
      - "4566:4566"
    environment:
      - AWS_DEFAULT_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
    volumes:
      - floci-data:/var/lib/floci

volumes:
  floci-data:
